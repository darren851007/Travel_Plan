<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFCF6">
  <title>我的旅行</title>

  <!-- 字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">

  <!-- 樣式：變數 → 基礎 → 版面 → 元件 → 動畫 -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">

  <!-- 程式：資料 → 核心 → 功能模組 → 進入點（defer 依序執行，不需伺服器） -->
  <script defer src="js/data/config.js"></script>
  <script defer src="js/data/destinations/korea.js"></script>
  <script defer src="js/data/destinations/japan.js"></script>
  <script defer src="js/core/notion-cache.js"></script>
  <script defer src="js/core/local-trips.js"></script>
  <script defer src="js/core/utils.js"></script>
  <script defer src="js/core/builder.js"></script>
  <script defer src="js/core/state.js"></script>
  <script defer src="js/core/router.js"></script>
  <script defer src="js/core/art.js"></script>
  <script defer src="js/modules/nav.js"></script>
  <script defer src="js/modules/hero.js"></script>
  <script defer src="js/modules/picker.js"></script>
  <script defer src="js/modules/countdown.js"></script>
  <script defer src="js/modules/flights.js"></script>
  <script defer src="js/modules/itinerary.js"></script>
  <script defer src="js/modules/checklist.js"></script>
  <script defer src="js/modules/lodging.js"></script>
  <script defer src="js/modules/notion-panel.js"></script>
  <script defer src="js/modules/add-item.js"></script>
  <script defer src="js/modules/new-trip.js"></script>
  <script defer src="js/modules/trip-delete.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body data-view="picker">
  <!-- ========== 頂端固定選單 ========== -->
  <header class="topnav">
    <nav class="container topnav__inner" aria-label="主選單">
      <a class="brand" href="#/">
        <span class="brand__back" aria-hidden="true">‹</span>
        <span class="brand__icon" data-art="planeIcon"></span>
        <span class="brand__text" data-text="brand">我的旅行</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="#flights">航班</a>
        <a class="nav-link" href="#itinerary">行程</a>
        <a class="nav-link" href="#prep">準備清單</a>
      </div>
    </nav>
  </header>

  <main>
    <!-- ========== 第一個畫面：選擇行程 ========== -->
    <div id="trips">
      <section class="trips container">
        <div class="trips__head">
          <span class="pill hero__eyebrow">選擇行程</span>
          <h1 class="trips__title">我的旅行</h1>
          <p class="hero__sub" id="trip-count"></p>
        </div>
        <div class="trip-list" id="trip-list"></div>
      </section>

      <!-- Notion 連結（部署在 Cloudflare 時顯示） -->
      <section id="notion" class="section container" hidden>
        <div class="section-head">
          <div>
            <h2 class="section-title">Notion 連結</h2>
            <p class="section-sub">用自己的 Notion 帳號登入，看你自己的旅行</p>
          </div>
        </div>
        <div class="card notion" id="notion-panel"></div>
      </section>
    </div>

    <!-- ========== 行程畫面 ========== -->
    <div id="trip-view">
    <!-- 首頁：插圖 + 標題 + 倒數 -->
    <section id="home" class="hero container">
      <div class="hero__art" id="hero-art"></div>
      <span class="pill hero__eyebrow" data-text="dateRange"></span>
      <h1 class="hero__title" data-text="title"></h1>
      <p class="hero__sub" data-text="subtitle"></p>

      <div class="countdown" id="countdown" role="timer">
        <p class="countdown__label">距離出發還有</p>
        <div class="countdown__grid">
          <div class="countdown__cell"><span class="countdown__num" data-unit="days">–</span><span class="countdown__unit">天</span></div>
          <div class="countdown__cell"><span class="countdown__num" data-unit="hours">–</span><span class="countdown__unit">時</span></div>
          <div class="countdown__cell"><span class="countdown__num" data-unit="minutes">–</span><span class="countdown__unit">分</span></div>
          <div class="countdown__cell"><span class="countdown__num" data-unit="seconds">–</span><span class="countdown__unit">秒</span></div>
        </div>
        <p class="countdown__done" hidden>出發囉！祝旅途愉快 ✈</p>
      </div>

      <!-- 刪除行程：自己在這台裝置建立的、或登入後從 Notion 同步的 -->
      <div class="trip-local" id="trip-local" hidden>
        <span class="pill tone-butter" id="trip-where"></span>
        <button class="btn btn--ghost btn--small" type="button" id="trip-delete">刪除這趟行程</button>
      </div>
    </section>

    <!-- ========== 航班 ========== -->
    <section id="flights" class="section container">
      <div class="section-head">
        <div>
          <h2 class="section-title">航班</h2>
          <p class="section-sub">去程與回程資訊</p>
        </div>
      </div>
      <div class="stack stack--2" id="flight-list"></div>
    </section>

    <!-- ========== 每日行程 ========== -->
    <section id="itinerary" class="section container">
      <div class="section-head">
        <div class="section-head__art" data-art="subway"></div>
        <div>
          <h2 class="section-title">每日行程</h2>
          <p class="section-sub">點選日期切換 · ★ 為必去景點</p>
        </div>
      </div>

      <!-- 新增景點（登入 Notion 並同步後才會出現按鈕） -->
      <div class="add-item-bar" id="add-item-bar" hidden>
        <button class="btn" type="button" id="add-item-open" hidden>＋ 新增景點</button>
        <p class="field__hint" id="add-item-hint"></p>
      </div>

      <div class="legend" id="transport-legend" aria-label="交通方式顏色說明"></div>
      <div class="day-tabs" id="day-tabs" role="tablist" aria-label="選擇日期"></div>
      <div class="day-panel" id="day-panel" role="tabpanel"></div>
    </section>

    <!-- ========== 準備清單 + 住宿 ========== -->
    <section id="prep" class="section container">
      <div class="section-head">
        <div class="section-head__art" data-art="suitcase"></div>
        <div>
          <h2 class="section-title">準備清單</h2>
          <p class="section-sub">打勾會記在這台裝置上</p>
        </div>
      </div>

      <div class="stack stack--2">
        <div class="card">
          <h3 class="card__title">待辦事項</h3>
          <div class="progress">
            <div class="progress__track" role="progressbar" aria-label="準備進度" aria-valuemin="0">
              <div class="progress__bar" id="checklist-bar"></div>
            </div>
            <span id="checklist-count">0 / 0</span>
          </div>
          <ul id="checklist"></ul>
        </div>

        <div class="card">
          <h3 class="card__title">
            <span class="card__title-art" data-art="house"></span>
            住宿資訊
          </h3>
          <div id="lodging"></div>
        </div>
      </div>
    </section>
    </div>
  </main>

  <!-- 新增景點對話框（加一筆到某一天的行程） -->
  <dialog class="dialog" id="add-item-dialog" aria-labelledby="add-item-title">
    <form class="dialog__form" id="add-item-form" novalidate>
      <h3 class="dialog__title" id="add-item-title">新增景點</h3>

      <label class="field">
        <span class="field__label">第幾天</span>
        <select id="add-item-day" name="day"></select>
      </label>

      <div class="dialog__row">
        <label class="field">
          <span class="field__label">時間</span>
          <input id="add-item-time" name="time" type="time" step="300">
        </label>
        <label class="field">
          <span class="field__label">城市</span>
          <input id="add-item-city" name="city" list="add-item-cities" autocomplete="off" maxlength="100">
          <datalist id="add-item-cities"></datalist>
        </label>
      </div>

      <label class="field">
        <span class="field__label">名稱</span>
        <input id="add-item-name" name="title" required maxlength="200" placeholder="例如：昌德宮" autocomplete="off">
      </label>

      <label class="field" id="add-item-theme-field" hidden>
        <span class="field__label">當日主題</span>
        <input id="add-item-theme" name="theme" maxlength="200" placeholder="例如：古宮與韓屋" autocomplete="off">
      </label>

      <fieldset class="field dialog__fieldset">
        <legend class="field__label">交通</legend>
        <div class="chip-list" id="add-item-transport"></div>
      </fieldset>

      <label class="check-row">
        <input type="checkbox" id="add-item-must" name="must">
        <span>★ 必去</span>
      </label>

      <label class="field">
        <span class="field__label">說明</span>
        <textarea id="add-item-note" name="note" rows="2" maxlength="2000" placeholder="例如：記得先預約"></textarea>
      </label>

      <p class="notion__msg" id="add-item-msg" role="status" aria-live="polite"></p>

      <div class="btn-row dialog__actions">
        <button class="btn btn--ghost" type="button" id="add-item-cancel">取消</button>
        <button class="btn" type="submit" id="add-item-submit">新增到 Notion</button>
      </div>
    </form>
  </dialog>

  <!-- 新增行程（整趟旅程）對話框 -->
  <dialog class="dialog" id="new-trip-dialog" aria-labelledby="new-trip-title">
    <form class="dialog__form" id="new-trip-form" novalidate>
      <h3 class="dialog__title" id="new-trip-title">新增行程</h3>

      <label class="field">
        <span class="field__label">國家</span>
        <select id="new-trip-country" name="country"></select>
      </label>

      <div class="field">
        <span class="field__label" id="new-trip-stops-label">城市與天數</span>
        <ul class="stops" id="new-trip-stops" aria-labelledby="new-trip-stops-label"></ul>
        <select id="new-trip-add-city" aria-label="加入城市"></select>
      </div>

      <div class="dialog__row">
        <label class="field">
          <span class="field__label">出發日</span>
          <input id="new-trip-date" name="date" type="date" required>
        </label>
        <label class="field">
          <span class="field__label">標題</span>
          <input id="new-trip-name" name="title" maxlength="100" autocomplete="off">
        </label>
      </div>

      <p class="new-trip__summary" id="new-trip-summary"></p>
      <p class="notion__msg" id="new-trip-msg" role="status" aria-live="polite"></p>

      <div class="btn-row dialog__actions">
        <button class="btn btn--ghost" type="button" id="new-trip-cancel">取消</button>
        <button class="btn" type="submit" id="new-trip-submit">建立到 Notion</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <footer class="footer">
    <div class="container">
      <p>祝旅途愉快 · Have a nice trip</p>
      <p class="footer__source" id="data-source"></p>
      <p class="footer__source"><a href="privacy.html">隱私權與使用條款</a></p>
    </div>
  </footer>
</body>
</html>
